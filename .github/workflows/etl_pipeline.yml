name: Daily ETL Pipeline

on:
  schedule:
    # 14:00 МСК = 11:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4 libnss3 libxss1 \
            libatk-bridge2.0-0 libgtk-3-0 fonts-liberation libasound2-data \
            libasound2-plugins alsa-utils

          # Устанавливаем Chrome
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          rm /tmp/chrome.deb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.15.2 undetected-chromedriver==3.5.3 rapidfuzz==3.6.1 \
            pandas==2.1.4 numpy==1.26.2 chromedriver-autoinstaller==0.4.0 \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Run ETL Pipeline
        run: |
          # Добавляем корень репозитория в PYTHONPATH, чтобы Python видел пакет etl
          export PYTHONPATH=$PYTHONPATH:$(pwd)

          # Запускаем виртуальный дисплей для Selenium
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3

          # Запуск ETL pipeline
          python etl/run_pipeline.py
