name: Daily ETL Pipeline

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4 libnss3 libxss1 libatk-bridge2.0-0 libgtk-3-0 fonts-liberation
          # Устанавливаем Chrome
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.15.2 undetected-chromedriver==3.5.3 rapidfuzz==3.6.1 pandas==2.1.4 numpy==1.26.2
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Run ETL Pipeline
        run: |
          # Запускаем с виртуальным дисплеем
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          python etl/run_pipeline.py