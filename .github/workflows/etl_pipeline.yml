name: Daily ETL Pipeline

on:
  schedule:
    # 14:00 МСК = 11:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

          # Определяем версию Chrome
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
          wget -N https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION -O chromedriver_version
          CHROMEDRIVER_VERSION=$(cat chromedriver_version)
          wget -N https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Удаляем старые numpy/pandas, чтобы избежать ошибки бинарной несовместимости
          pip uninstall -y numpy pandas
          pip install numpy==1.26.1 pandas==2.1.1
          pip install -r requirements.txt
          pip install selenium==4.12.0 chromedriver_autoinstaller undetected-chromedriver google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Set GDrive secret
        run: echo "$GDRIVE_KEY_JSON" > etl/gdrive_key.json
        env:
          GDRIVE_KEY_JSON: ${{ secrets.GDRIVE_KEY_JSON }}

      - name: Run ETL Pipeline
        run: python etl/run_pipeline.py
