name: Daily ETL Pipeline

on:
  schedule:
    # 14:00 МСК = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_pipeline:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb unzip wget curl gnupg apt-transport-https \
            libxi6 libgconf-2-4 libnss3 libxss1 \
            libatk-bridge2.0-0 libgtk-3-0 fonts-liberation \
            libasound2

      - name: Install Google Chrome stable
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            selenium==4.15.2 \
            undetected-chromedriver==3.5.3 \
            webdriver-manager==4.0.2 \
            rapidfuzz==3.6.1 \
            pandas==2.1.4 \
            numpy==1.26.2 \
            requests
      - name: Создать необходимые директории
        run: |
          mkdir -p data/raw
          mkdir -p data/processed

      - name: Run ETL Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Запуск ETL pipeline: $(date)"
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 5
          curl -s "https://api.proxyscrape.com/v2/?request=get&protocol=http&timeout=5000&country=all" | head -1 > proxy.txt
          export PROXY_URL=$(cat proxy.txt)
          echo "Новый прокси: $PROXY_URL"

          python etl/run_pipeline.py || (echo "Без прокси"; unset PROXY_URL; python etl/run_pipeline.py)
      
      
