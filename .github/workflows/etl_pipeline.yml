name: Daily ETL Pipeline

on:
  schedule:
    # 12:00 МСК = 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Set GDrive secret
        run: echo "$GDRIVE_KEY_JSON" > etl/gdrive_key.json
        env:
          GDRIVE_KEY_JSON: ${{ secrets.GDRIVE_KEY_JSON }}

      - name: Run ETL Pipeline
        run: python etl/run_pipeline.py
