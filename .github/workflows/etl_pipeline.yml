name: Daily ETL Pipeline

on:
  schedule:
    # 14:00 МСК = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1.5.0
        with:
          chrome-version: 'stable'
          install-chromedriver: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxi6 libnss3 libxss1 libatk-bridge2.0-0 libgtk-3-0 fonts-liberation libasound2 libgbm1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.15.2 undetected-chromedriver==3.5.3 rapidfuzz==3.6.1 pandas==2.1.4 numpy==1.26.2
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Run ETL Pipeline
        run: |
          # Запускаем с виртуальным дисплеем
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          # Даем Xvfb время запуститься
          sleep 3
          python etl/run_pipeline.py