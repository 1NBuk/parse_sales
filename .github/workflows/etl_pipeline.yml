name: Daily ETL Pipeline

on:
  schedule:
    # 14:00 МСК = 11:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─── Установка Chrome и ChromeDriver ───
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install chromedriver_autoinstaller
        run: pip install chromedriver-autoinstaller selenium undetected-chromedriver

      # ─── Установка Python-зависимостей ───
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.1 pandas==2.1.1
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      # ─── Установка PYTHONPATH ───
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      # ─── GDrive JSON ───
      - name: Set GDrive secret
        run: echo "$GDRIVE_KEY_JSON" > etl/gdrive_key.json
        env:
          GDRIVE_KEY_JSON: ${{ secrets.GDRIVE_KEY_JSON }}

      # ─── Запуск ETL ───
      - name: Run ETL Pipeline
        run: python etl/run_pipeline.py
