name: ETL Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # каждый день в 00:00 UTC (03:00 МСК)
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Set GDrive secret
        run: echo "$GDRIVE_KEY_JSON" > etl/gdrive_key.json
        env:
          GDRIVE_KEY_JSON: ${{ secrets.GDRIVE_KEY_JSON }}

      - name: Run ETL Pipeline
        run: python etl/run_pipeline.py
